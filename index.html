<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absinthe Edge</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Edge">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1d">
<meta name="description" content="NFL + NBA picks for Kalshi and DraftKings Pick6 with full stat projections and a self-grading accuracy tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Night slate: ink-navy stadium night, team colors carry the card art, scoreboard-condensed numerals */
:root{
  --ink:#0a0f1d;--ink2:#0f1628;--panel:#141d33;--panel2:#1b2640;--line:#26324f;--line2:#33416a;
  --chalk:#eef2f9;--muted:#93a0bb;--dim:#62708f;
  --brass:#f0b54a;--brassbg:rgba(240,181,74,.14);
  --more:#3ddc97;--morebg:rgba(61,220,151,.14);--less:#ff6f6f;--lessbg:rgba(255,111,111,.14);
  --p6:#ff9a3c;--p6bg:rgba(255,154,60,.15);--ks:#3fc9c0;--ksbg:rgba(63,201,192,.15);--warn:#ffd166;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--chalk);font:14px/1.45 var(--body)}
body{min-height:100vh;background:radial-gradient(1000px 520px at 85% -10%,rgba(240,181,74,.07),transparent 60%),radial-gradient(900px 600px at -10% 0,rgba(63,201,192,.06),transparent 60%),var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--brass)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,15,29,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--ink)}
.hrow{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--brass),#e07b39,var(--brass));display:grid;place-items:center;color:var(--ink);font:800 20px var(--display)}
.brand b{font:800 22px/1 var(--display);letter-spacing:.06em}
.ver{font:700 11px var(--body);color:var(--brass);background:var(--brassbg);border:1px solid rgba(240,181,74,.35);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:3px;letter-spacing:.04em}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:10.5px;line-height:1.25;color:var(--dim);white-space:nowrap}
.meta b{color:var(--muted);font-weight:600}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;font:700 16px var(--display);letter-spacing:.06em;color:var(--muted)}
.seg button.on{background:var(--chalk);color:var(--ink)}
.grow{flex:1}
.search{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:240px;outline:none}
.search:focus{border-color:var(--brass)}

nav.tabs{display:flex;gap:2px}
nav.tabs button{border:0;background:none;padding:11px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--chalk);border-color:var(--brass)}
.bnav{display:none}
/* accuracy strip */
.strip{margin:16px 0 4px;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
.strip .dot{width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 4px var(--brassbg);flex:none}
.strip b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.strip .m{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--ink2));border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font:800 30px/1.1 var(--display);margin-top:4px}
.kpi .s{color:var(--dim);font-size:12px}
.kpi svg{display:block;margin-top:6px;width:100%;height:24px}
/* controls */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{color:var(--ink);background:var(--chalk);border-color:var(--chalk)}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.sep{width:1px;height:22px;background:var(--line)}
h2{font:700 22px/1.2 var(--display);letter-spacing:.03em;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;text-wrap:balance}
h2 .cnt{font:500 13px var(--body);color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.note{color:var(--muted);font-size:12.5px}
/* game banner */
.gb{margin:28px 0 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.gbt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(100deg,var(--ca) -20%,transparent 38%,transparent 62%,var(--ch) 120%)}
.gtm{display:flex;align-items:center;gap:12px;min-width:0}
.gtm.h{justify-content:flex-end;text-align:right}
.gtm img{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.gtm .n{font:800 24px/1 var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtm .r{color:var(--muted);font-size:12px}
.gtm .pp{font:800 30px/1 var(--display);color:var(--chalk)}
.gmid{text-align:center}
.gmid .t{font:700 15px var(--display);letter-spacing:.05em;color:var(--chalk)}
.gmid .w{color:var(--muted);font-size:11.5px}
.pw{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:4px;background:rgba(10,15,29,.45);border:1px solid var(--line2);border-radius:12px;padding:6px 14px}
.pw>span:first-child{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.pw b{font:800 18px var(--display);letter-spacing:.02em;white-space:nowrap}
.pw .sc{font:800 22px var(--display);line-height:1}
.pw .w{font-size:11px;color:var(--muted)}
.pw .tot{font-size:11.5px;color:var(--chalk);margin-top:2px}.pw .tot b{font:800 16px var(--display);color:var(--brass)}
.pw .gg{display:flex;align-items:center;gap:2px;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.pw .gg .grade{width:20px;height:20px;font-size:13px}
.gbm{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--ink2)}
.tag{font-size:11.5px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:3px 8px;border-radius:7px;white-space:nowrap}
.tag.g{color:var(--more);border-color:rgba(61,220,151,.3)}.tag.r{color:var(--less);border-color:rgba(255,111,111,.3)}.tag.y{color:var(--warn);border-color:rgba(255,209,102,.3)}
.gpk{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
/* pick card */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.art{position:relative;height:118px;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 35%,var(--ink)) 75%);overflow:hidden}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,15,29,.65))}
.art .wm{position:absolute;right:-18px;top:-14px;width:150px;height:150px;opacity:.22;object-fit:contain}
.art .hs{position:absolute;left:10px;bottom:0;height:112px;width:auto;max-width:150px;object-fit:contain;object-position:bottom;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.art .ini{position:absolute;left:18px;bottom:16px;font:800 46px var(--display);color:rgba(255,255,255,.75);z-index:1}
.art .bl{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.art .tl{position:absolute;top:10px;left:10px;z-index:2}
.art .who{position:absolute;right:12px;bottom:10px;z-index:2;text-align:right;max-width:58%}
.art .who .nm{font:800 22px/1.02 var(--display);letter-spacing:.01em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.art .who .sb{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:2px}
.badge{font:800 10.5px var(--body);letter-spacing:.07em;padding:3px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.b-p6{color:#1a0e00;background:var(--p6)}.b-ks{color:#00201e;background:var(--ks)}
.b-inj{color:#241a00;background:var(--warn)}
.tier{font:800 11px var(--body);letter-spacing:.08em;padding:4px 9px;border-radius:99px;text-transform:uppercase}
.tier.Lock{background:var(--brass);color:var(--ink)}.tier.Strong{border:1.5px solid var(--brass);color:var(--brass);background:rgba(10,15,29,.55)}.tier.Lean{background:rgba(10,15,29,.55);color:var(--chalk);border:1px solid rgba(255,255,255,.25)}
.cb{padding:12px 14px 14px;display:grid;gap:10px}
.call{display:flex;align-items:center;justify-content:space-between;gap:10px}
.call .st{min-width:0}
.call .ln{font:800 30px/1 var(--display)}
.call .lab{color:var(--muted);font-size:12.5px;font-weight:600}
.pill{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;padding:6px 12px;border-radius:12px;font-family:var(--display);line-height:1}
.pill b{font-size:15px;font-weight:800;letter-spacing:.08em}
.pill span{font-size:26px;font-weight:800}
.pill.MORE,.pill.YES{color:var(--more);background:var(--morebg);box-shadow:inset 0 0 0 1px rgba(61,220,151,.35)}
.pill.LESS,.pill.NO{color:var(--less);background:var(--lessbg);box-shadow:inset 0 0 0 1px rgba(255,111,111,.35)}
.pbar{position:relative;height:8px;background:var(--panel2);border-radius:99px}
.pbar b{position:absolute;top:0;height:8px;border-radius:99px}
.pbar i{position:absolute;top:-4px;width:2px;height:16px;background:var(--chalk);border-radius:2px}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.plab strong{color:var(--chalk);font-family:var(--display);font-size:15px}
.spark{display:flex;align-items:flex-end;gap:10px}
.spark svg{flex:1;height:38px;min-width:0}
.spark .sl{font-size:11px;color:var(--dim);line-height:1.25;text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.grade{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font:800 14px var(--display);margin-right:4px;vertical-align:middle}
.foot{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.foot b{color:var(--chalk);font-variant-numeric:tabular-nums}
.up{color:var(--more)}.dn{color:var(--less)}
/* player projection cards */
.pc .art{height:96px}.pc .art .hs{height:92px}
.statline{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.sl{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center}
.sl .k{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.sl .v{font:800 18px var(--display)}
.sl.has{border-color:rgba(240,181,74,.5);background:linear-gradient(180deg,var(--brassbg),var(--panel2))}
/* games */
.wpb{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);margin:4px 18px 0}
.wpl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 18px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;padding:0 18px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.gml{display:grid;gap:6px;padding:0 18px 16px}
.gmr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.mini{height:6px;background:var(--ink);border-radius:99px;overflow:hidden;min-width:60px}
.mini b{display:block;height:6px}
/* tables */
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child,.l{text-align:left!important}
.w{color:var(--more);font-weight:700}.lz{color:var(--less);font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font:700 18px var(--display);letter-spacing:.03em}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--panel2)}tr.sel td{background:var(--brassbg)}
.kpi.clk{cursor:pointer;transition:border-color .15s}.kpi.clk:hover{border-color:var(--brass)}
.twg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0;transition:border-color .15s}.tw:hover{border-color:var(--brass)}
.tw .tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:3px 0;color:var(--muted)}.tw .tr img{width:22px;height:22px}
.tw .tr.win{color:var(--chalk)}.tw .tr.win .nm{font-weight:800}.tw .tr .sc{font:800 18px var(--display)}.tw .tr .wp{font:700 13px var(--body);min-width:38px;text-align:right}
.tw .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tw .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:11.5px;color:var(--dim)}
.tw .wpb{margin:6px 0 0;height:6px}
.tw.top{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}.tw .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;min-width:0}
.bet.cash{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}.bet.lost{opacity:.6}
.bet .bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bet .bh .ttl{font:800 18px var(--display);letter-spacing:.02em;flex:1;min-width:180px}
.sig{font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.sig.cash{background:var(--brass);color:var(--ink)}.sig.hold{border:1px solid var(--line2);color:var(--chalk)}.sig.won{background:var(--morebg);color:var(--more)}.sig.lost{background:var(--lessbg);color:var(--less)}
.bmon{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 8px}.bmon>div{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.bmon span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.bmon b{font:800 19px var(--display)}
.legs{display:grid;gap:6px;margin-top:10px}.leg{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--ink2)}
.leg .lg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leg small{color:var(--dim);margin-left:6px}
.lv{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;white-space:normal;font-size:12px;color:var(--muted)}.lv .st{font-weight:700;color:var(--chalk);font-variant-numeric:tabular-nums}.lv .st.ok{color:var(--more)}.lv .st.bad{color:var(--less)}
.lv .clk{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}.lv .clk i{width:7px;height:7px;border-radius:50%;background:var(--less);animation:lvp 1.6s infinite}.lv .clk.done i{background:var(--dim);animation:none}
.lv .prog{flex:0 0 90px;height:4px;background:var(--ink);border-radius:99px;overflow:hidden}.lv .prog b{display:block;height:4px;border-radius:99px}
@keyframes lvp{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.lv .clk i{animation:none}}
@media (max-width:760px){.bmon{grid-template-columns:repeat(2,minmax(0,1fr))}.leg .mini,.leg .tag{display:none}.leg small{display:block;margin-left:0}.lv .prog{flex-basis:60px}}
.fx{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.fx:last-child{border:0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,8,16,.7);backdrop-filter:blur(5px);z-index:60;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px max(12px,env(safe-area-inset-right,0px)) 30px max(12px,env(safe-area-inset-left,0px))}
.modal.on{display:flex}
.mbox{background:var(--ink2);border:1px solid var(--line2);border-radius:20px;max-width:980px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mhead{position:relative;display:flex;gap:18px;align-items:flex-end;padding:18px 20px 0;min-height:170px;background:linear-gradient(120deg,var(--tc),color-mix(in srgb,var(--tc) 25%,var(--ink2)) 70%);overflow:hidden}
.mhead .wm{position:absolute;right:-30px;top:-30px;width:240px;opacity:.18}
.mhead .hs{height:160px;width:auto;position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.mhead .info{position:relative;z-index:1;padding-bottom:16px;min-width:0}
.mhead .nm{font:800 34px/1 var(--display)}
.x{position:absolute;top:14px;right:14px;z-index:2;border:1px solid rgba(255,255,255,.25);background:rgba(10,15,29,.5);border-radius:10px;width:36px;height:36px}
.mbody{padding:18px 20px 22px}
.statsel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.statsel .chip b{font-family:var(--display);font-size:14px;margin-left:3px}
.hide{display:none!important}
.footer{color:var(--dim);font-size:12px;padding:30px 0 40px;border-top:1px solid var(--line);margin-top:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d=0) => x == null || isNaN(x) ? "—" : (x*100).toFixed(d) + "%";
const fmt = (x, d=1) => x == null || isNaN(x) ? "—" : (+x).toFixed(d).replace(/\.0$/, "");
const LBL = {min:"MIN",points:"PTS",rebounds:"REB",assists:"AST",threes:"3PM",steals:"STL",blocks:"BLK",turnovers:"TO",pra:"PRA",pts_reb:"P+R",pts_ast:"P+A",reb_ast:"R+A",stl_blk:"S+B",pass_yds:"Pass Yds",pass_tds:"Pass TD",pass_cmp:"Comp",pass_att:"Att",ints:"INT",rush_yds:"Rush Yds",rush_att:"Carries",pass_rush_yds:"Pass+Rush",receptions:"Rec",targets:"Tgts",rec_yds:"Rec Yds",rush_rec_yds:"Rush+Rec",anytime_td:"TDs",long_rec:"Long Rec",tackles:"Tackles",sacks:"Sacks",fg_made:"FG",kick_pts:"Kick Pts"};
const TYPE = {ml:"Winner",spread:"Spread",total:"Total",prop:"Player prop"};
const GRADE_C = {A:"#3ddc97",B:"#9be37a",C:"#c9cfdc",D:"#ffb26b",F:"#ff6f6f"};
let B = null, P = {}, MB = null, GT = null;
let S = {sport:"NBA", tab:"picks", plat:"all", recOnly:true, game:"all", sort:"prob", q:"", pstat:"all", tierF:"all", group:"game"};
try { Object.assign(S, JSON.parse(localStorage.getItem("ae-state") || "{}"), {q:"", game:"all"}); } catch(e) {}
const save = () => { try { localStorage.setItem("ae-state", JSON.stringify({sport:S.sport, tab:S.tab, pview:S.pview, plat:S.plat, recOnly:S.recOnly, sort:S.sort, group:S.group, tierF:S.tierF, seen30:S.seen30, obMode:S.obMode})); } catch(e) {} };

const toDate = t => new Date(t.endsWith("Z") ? t : t + "Z");
const when = t => t ? toDate(t).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}) : "";
function ago(t) { const m = Math.round((Date.now() - new Date(t).getTime())/60000); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m/60) + " h ago" : Math.round(m/1440) + " d ago"; }
function sp() { return (B && B.sports[S.sport]) || {games:[], players:{}, picks:[], gamePicks:[]}; }
function gameOf(id) { return sp().games.find(g => g.id === id); }
function teamInfo(ab) { for (const g of sp().games) for (const s of ["home","away"]) if (g[s] && g[s].abbr === ab) return g[s]; return {}; }
function tc(ab) { const t = teamInfo(ab); return t.color ? "#" + t.color : "#33416a"; }
function logo(ab, cls="", style="width:18px;height:18px;vertical-align:-4px;margin-right:3px") { const t = teamInfo(ab); return t.logo ? `<img class="${cls}" style="${style}" src="${esc(t.logo)}" alt="">` : ""; }
function aggr(k) { return ((B.summary || {}).agg || {})[k] || {}; }
function headshot(p, cls="hs") {
  const init = (p.name || "?").split(" ").map(x => x[0]).slice(0,2).join("");
  const alt = p.dkImg ? `if(!this.dataset.f){this.dataset.f=1;this.src='${esc(p.dkImg)}'}else{this.replaceWith(Object.assign(document.createElement('div'),{className:'ini',textContent:'${esc(init)}'}))}` : `this.replaceWith(Object.assign(document.createElement('div'),{className:'ini',textContent:'${esc(init)}'}))`;
  return `<img class="${cls}" loading="lazy" src="${esc(p.img || p.dkImg || "")}" onerror="${alt}" alt="">`;
}
const isOver = side => side === "MORE" || side === "YES";

// ---------------- accuracy strip ----------------
function spark(vals, w=120, h=24) {
  if (vals.length < 2) return "";
  const xs = (i) => i * (w / (vals.length - 1)), ys = v => h - 2 - v * (h - 4);
  const pts = vals.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${ys(.5)}" y2="${ys(.5)}" stroke="var(--line2)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="${xs(vals.length-1)}" cy="${ys(vals[vals.length-1])}" r="3" fill="var(--brass)"/></svg>`;
}
function kpis() {
  const all = aggr("rec|all"), tot = (all.w||0) + (all.l||0);
  const sm = B.summary || {};
  if (!tot) {
    $("#kpis").innerHTML = `<div class="strip"><span class="dot"></span><b>Self-grading is on</b><span class="m">Tracking since ${esc(sm.since || "today")} · ${(sm.pending||0).toLocaleString()} picks and projections waiting on final scores. The record appears here a few hours after the first games end.</span></div>`;
    return;
  }
  const days = Object.values(sm.daily || {}).map(d => d.rec).filter(d => d[0] + d[1] > 0).map(d => d[0]/(d[0]+d[1]));
  const pe = sm.projErr || {}; let n = 0, within = 0;
  for (const [k, v] of Object.entries(pe)) if (k.startsWith(S.sport + "|")) { n += v[0]; within += v[3]; }
  const card = (lab, r, extra="", sv="", key="all") => { const t = (r.w||0)+(r.l||0); return `<div class="kpi clk" role="button" tabindex="0" onclick="pickGroup('${key}','${lab}')" title="See these picks"><div class="l">${lab} ›</div><div class="v">${r.pct == null ? "—" : pct(r.pct,1)}</div><div class="s">${t ? `${r.w}-${r.l}${r.p ? "-"+r.p : ""}` : "no grades yet"}${extra}</div>${sv}</div>`; };
  const ks = aggr("rec|Kalshi");
  $("#kpis").innerHTML = `<div class="kpis">${card("Best plays", all, "", spark(days.slice(-20)), "all")}${card(S.sport, aggr("rec|"+S.sport), "", "", S.sport)}${card("Pick6", aggr("rec|Pick6"), "", "", "Pick6")}${card("Locks", aggr("rec|tier|Lock"), "", "", "tier|Lock")}${card("Kalshi", ks, ks.roi != null ? ` · ROI ${ks.roi >= 0 ? "+" : ""}${pct(ks.roi,1)}` : "", "", "Kalshi")}
    <div class="kpi"><div class="l">Projection accuracy</div><div class="v">${n ? pct(within/n,0) : "—"}</div><div class="s">${n ? `stats within 25% · ${n.toLocaleString()} graded` : "after games finish"}</div></div></div>`;
}

// ---------------- pick card ----------------
function sparkBars(vals, line, over) {
  if (!vals || !vals.length) return `<div class="note">No recent games.</div>`;
  const W = 200, H = 38, n = vals.length, bw = W / Math.max(n, 10);

  if (!S.recOnly) picks = picks.filter(p => p.platform === "Pick6" || p.main || p.rec);
  const tierRank = {Lock:0, Strong:1, Lean:2};

// Winner pick grade: sureness of the projection plus the price Kalshi charges for that team
function winnerPick(g) {
  const q = gameGrade(g); if (!q) return null;
  const hw = g.proj.homePts >= g.proj.awayPts, w = hw ? g.home : g.away;
  const mk = sp().gamePicks.find(p => p.gameId === g.id && p.type === "ml" && (p.label || "").toLowerCase() === (w.short + " to win").toLowerCase());
  let score = q.s, price = null, edge = null;
  if (mk && mk.yesAsk) {
    const pYes = (mk.side || "YES").toUpperCase() === "YES" ? mk.prob : 1 - mk.prob;
    price = mk.yesAsk; edge = pYes - price;
    score += Math.max(-15, Math.min(15, edge * 150));
  }
  score = Math.round(Math.max(0, Math.min(100, score)));
  const gr = score >= 72 ? "A" : score >= 58 ? "B" : score >= 44 ? "C" : "D";
  return {gr, score, label: {A:"Best look", B:"Good look", C:"Meh", D:"Pass"}[gr], team: w, price, edge, sure: q, mk};
}
function teamWinners(q) {
  const s = sp();
  let gs = s.games.filter(g => g.proj && g.proj.pHome != null && (S.game === "all" || g.id === S.game) &&

  if (!gs.length) return "";
  const wsort = S.wsort || "best";
  if (wsort === "best") gs = gs.slice().sort((a, b) => (winnerPick(b)?.score ?? 0) - (winnerPick(a)?.score ?? 0));
  else if (S.wsort === "sure") gs = gs.slice().sort((a, b) => (gameGrade(b)?.s ?? 0) - (gameGrade(a)?.s ?? 0));
  else if (S.wsort === "odds") gs = gs.slice().sort((a, b) => Math.max(b.proj.pHome, 1 - b.proj.pHome) - Math.max(a.proj.pHome, 1 - a.proj.pHome));
  else if (S.wsort === "pay") gs = gs.slice().sort((a, b) => ((winnerPick(a) || {}).price ?? 2) - ((winnerPick(b) || {}).price ?? 2));
  else if (S.wsort === "fav") gs = gs.slice().sort((a, b) => Math.abs(b.proj.pHome - .5) - Math.abs(a.proj.pHome - .5));
  const row = (g, side) => { const t = g[side], p = side === "home" ? g.proj.pHome : 1 - g.proj.pHome, pts = side === "home" ? g.proj.homePts : g.proj.awayPts;
    const won = side === "home" ? g.proj.homePts >= g.proj.awayPts : g.proj.awayPts > g.proj.homePts;
    return `<div class="tr ${won ? "win" : ""}"><img src="${esc(t.logo)}" alt=""><span class="nm">${esc(t.short)} <small style="color:var(--dim);font-weight:500">${esc(t.record || "")}</small></span><span class="sc">${Math.round(pts)}</span><span class="wp" style="color:${won ? "var(--more)" : "var(--dim)"}">${pct(p)}</span></div>`; };
  const topIds = new Set(gs.map(g => [g.id, winnerPick(g)]).filter(([, w]) => w && w.gr === "A").sort((a, b) => b[1].score - a[1].score).slice(0, 3).map(([id]) => id));
  const sel = (v, l) => `<option value="${v}" ${(S.wsort || "best") === v ? "selected" : ""}>${l}</option>`;
  return `<h2>Team winners <span class="cnt">${gs.length} games · projected winner, score, win chance and a pick grade · tap for the full game</span></h2>
    <div class="filters" style="margin-top:-4px"><select class="chip" onchange="S.wsort=this.value;render()" aria-label="Sort winners">${sel("best","Sort: best looks")}${sel("time","Sort: game time")}${sel("sure","Sort: most sure")}${sel("fav","Sort: biggest favorite")}${sel("odds","Sort: highest win odds")}${sel("pay","Sort: biggest payout")}</select></div>
    <div class="twg">${gs.map(g => { const wp = winnerPick(g), top = wp && wp.gr === "A" && topIds.has(g.id);
      return `<div class="tw ${top ? "top" : ""}" role="button" tabindex="0" onclick="S.tab='games';render();setTimeout(()=>{const e=document.getElementById('g-${g.id}');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},50)">

        <div class="wpb"><div style="width:${(1 - g.proj.pHome) * 100}%;background:${tc(g.away.abbr)}"></div><div style="flex:1;background:${tc(g.home.abbr)}"></div></div>

}

// ---------------- V3.3: Odds Board (players + team winners, NFL and NBA) ----------------
const beOf = p => p.platform === "Kalshi" ? (p.price || 1) : Math.max(0.01, (p.prob ?? 0) - (p.edge ?? 0));
function oddsLists(sport, mode) {
  const s = (B && B.sports[sport]) || {picks: [], gamePicks: [], games: [], players: {}};
  // players: one line per player (their best line for the chosen mode)
  const best = {};
  for (const p of s.picks) {
    if (p.prob == null || !p.pid) continue;
    if (mode === "pay" && p.platform !== "Kalshi") continue;
    if (mode === "pay" && (p.prob < 0.08 || !p.price)) continue;
    const score = mode === "pay" ? 1 / p.price : p.prob;
    if (!best[p.pid] || score > best[p.pid].score) best[p.pid] = {p, score};
  }
  const players = Object.values(best).sort((a, b) => b.score - a.score).slice(0, 40).map(({p}) => {
    const sideTxt = p.platform === "Pick6" ? (p.side === "MORE" ? "over" : "under") : (p.side === "YES" ? "over" : "under");
    const lab = `${p.player} ${sideTxt} ${fmt(p.line)} ${p.stat}`;
    const txt = mode === "pay"
      ? `${Math.round((1 / p.price - 1) * 100)}% return · ${lab} · ${Math.round(p.price * 100)}¢, model ${pct(p.prob)}`
      : `${pct(p.prob)} · ${lab} · ${p.platform}`;
    return {v: `p|${sport}|${p.pid}`, t: txt};
  });
  // teams: every team in every upcoming game
  const teams = [];
  for (const g of s.games) {
    if (!g.proj || g.proj.pHome == null) continue;
    for (const side of ["home", "away"]) {
      const t = g[side], pw = side === "home" ? g.proj.pHome : 1 - g.proj.pHome;
      const mk = s.gamePicks.find(x => x.gameId === g.id && x.type === "ml" && (x.label || "").toLowerCase() === (t.short + " to win").toLowerCase());
      const price = mk ? mk.yesAsk : null;
      if (mode === "pay" && (!price || pw < 0.08)) continue;
      const vs = side === "home" ? `vs ${g.away.abbr}` : `@ ${g.home.abbr}`;
      teams.push({score: mode === "pay" ? 1 / price : pw, v: `g|${sport}|${g.id}`,
        t: mode === "pay" ? `${Math.round((1 / price - 1) * 100)}% return · ${t.short} ${vs} · ${Math.round(price * 100)}¢, model ${pct(pw)}` : `${pct(pw)} · ${t.short} ${vs}${price ? ` · Kalshi ${Math.round(price * 100)}¢` : ""}`});
    }
  }
  teams.sort((a, b) => b.score - a.score);
  return {players, teams: teams.slice(0, 40)};
}
function oddsBoard() {
  if (!B) return "";
  const mode = S.obMode || "likely";
  const col = sport => {
    if (!B.sports[sport]) return "";
    const L = oddsLists(sport, mode);
    const opt = (arr, ph) => `<option value="">${ph} (${arr.length})</option>` + arr.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("");
    return `<div class="obs"><b class="sp">${sport}</b>
      <label>Players · ${mode === "pay" ? "biggest payout" : "most likely to hit"}<select onchange="obGo(this.value)">${opt(L.players, "Pick a player")}</select></label>
      <label>Teams to win · ${mode === "pay" ? "biggest payout" : "highest win odds"}<select onchange="obGo(this.value)">${opt(L.teams, "Pick a team")}</select></label></div>`;
  };
  return `<div class="ob"><h3>Odds Board <span class="seg"><button class="${mode === "likely" ? "on" : ""}" onclick="S.obMode='likely';render()">Most likely</button><button class="${mode === "pay" ? "on" : ""}" onclick="S.obMode='pay';render()">Biggest payout</button></span>
    <span class="note">${mode === "pay" ? "Longest Kalshi odds first (return if it hits), with the model's chance; long shots under 8% are left out." : "Highest model chance first."}</span></h3>
    <div class="obg">${col("NFL")}${col("NBA")}</div></div>`;
}

    ${fx([["Season average (last season fills in early)","40%"],["Last 5 games","30%"],["Home or away split","15%"],["History vs this opponent, last 3 seasons","up to 15%"]])}
    <p class="note" style="margin-top:10px">Then adjusts for:</p>
    ${fx([["Defense vs position, from every box score this season, and its rank","±12%"],["Vegas implied team total (game script)","±10%"],["Pace: projected possessions for both NBA teams","±4%"],["Weather at open-air NFL stadiums; domes are neutral","−12% to +3%"],["Team rest, back-to-backs, road-trip length, travel miles, byes","−4% to +2%"],["Player rest: returning from missed games, heavy minutes on a back-to-back","−7% to 0%"],["Teammates out: their shots, targets or carries go to others","up to +15%"],["Starting QB out (backup in)","−8%"],["Opposing defenders out (rim protectors, corners, pass rushers)","up to +5%"],["Injury status: Out/Doubtful players are never a best play","filter"],["NFL snap share trend, last 3 vs season (nflverse)","±10%"],["NFL target / air-yards share trend (nflverse)","±12%"],["Red-zone looks → expected TDs (nflverse play-by-play)","−30% to +35%"],["Next Gen Stats: separation, rush yards over expected, CPOE","±4%"],["Official injury reports: NFL practice status, NBA questionable/probable","−12% to 0%"],["ESPN depth chart (deep backups)","−5%"]])}</div>
  <div class="panel"><h3>Picks, tiers and grades</h3>
    <p class="note"><b>Pick6:</b> the projection and the player's game-to-game swing give a chance to go over or under. A best play needs 2+ points over the ${pct(be,1)} break-even for a 3-pick entry, adjusted for a boosted or reduced payout. When Kalshi prices the same player and stat, its price is mixed in as a reality check.</p>
    <p class="note"><b>Kalshi:</b> the model is blended 40/60 with the market price, and a best play has to beat the price by 5¢ (4¢ for game markets). Only the best rung on each ladder counts.</p>
    ${fx([["Lock","Pick6 68%+ · Kalshi edge 10¢+"],["Strong","Pick6 62%+ · Kalshi edge 7¢+"],["Lean","any other best play"]])}
    <p class="note" style="margin-top:10px"><b>Matchup grade (A–F)</b> rolls every adjustment for that stat into one letter: A means the setup lifts him 7%+, F means it costs him 7%+. <b>Streak</b> counts straight games over or under the line. <b>Line movement</b> shows how far a Pick6 line or Kalshi price has moved since this board first saw it, and whether it moved toward our side.</p>
    <p class="note"><b>Game sureness (A–D)</b> grades how much to trust each projected winner and final score, out of 100: how big the favorite is (45), whether the model agrees with the Vegas spread (25) and total (15), and how many games both teams have played (15), minus points for bad weather, back-to-backs and long injury lists. A = Strong (70+, and Vegas must back it up), B = Solid, C = Shaky, D = Toss-up. It's a guide to how sure the model is, not a track record yet.</p>
    <p class="note"><b>Team winners pick grade (A–D)</b> starts from the game sureness score and adds or takes away up to 15 points for the Kalshi price: if Kalshi charges less for the projected winner than the model thinks it's worth, the grade goes up. A = Best look, B = Good look, C = Meh, D = Pass. The top three A's get a ★ Top pick tag.</p>
    <p class="note"><b>Game-winner tracker:</b> every game's projected winner, score, win chance and grades are saved right before tip-off or kickoff and graded after the final. The Accuracy tab compares how often each grade wins with what the model expected, and lists tuning hints once a group has 10+ finals.</p>
    <p class="note"><b>One-click orders</b> go through a Cloudflare Worker you own, which holds your Kalshi key; this page never sees it. Every order is a limit order at the price you confirm, filled right away or canceled, and the worker re-checks the live price and your per-order cap before sending.</p>
    <p class="note"><b>Combos</b> are Kalshi multi-leg markets. The slip multiplies the model's chance for each leg (rougher when legs share a game), the worker asks Kalshi's market makers for a price, and you buy at that price or not at all.</p>
    <p class="note"><b>My Bets</b> reads your open Kalshi bets with your own API key, kept in GitHub Secrets and never shown on the page. For each one it multiplies the model's chance for every leg into a value, and says <b>Cash out</b> when Kalshi's bid is above that value.</p>
    <h3 style="margin-top:14px">Self-checking</h3>
    <p class="note">Every pick and projected stat is saved before the game. Kalshi picks are graded by Kalshi's settlement and cross-checked with the ESPN box score; if the two disagree the pick is flagged and left out of the record. Pick6 picks and projected stats are graded against the ESPN box score. The Accuracy tab shows the record by platform, tier, bet type, stat and confidence, plus projection error. After 30+ graded picks on a stat, the model rescales its own confidence for it.</p>
    <h3 style="margin-top:14px">Version history</h3>
    <p class="note">Every update bumps the version: small batches of features add 0.1; a big overhaul moves to the next whole number.</p>
    ${[["V3.5","Live numbers on My Bets: every leg shows the player's live stat against your line with a progress bar and how much is left to go, team legs show the score and who's ahead, and each game shows the quarter and time left in it · Refreshes every 30 seconds while a game is on, straight from ESPN, without waiting for the board update · Legs flip to Hit or Missed as soon as they're decided, and the legs-hit count updates live"],["V3.4","Reliable refresh: each update now queues the next one about 30 minutes later, so the board no longer goes hours without updating when GitHub skips its scheduled runs"],["V3.3","Odds Board at the top of Top Picks: NFL and NBA side by side, each with a players dropdown and a teams-to-win dropdown, switchable between most likely and biggest payout; pick one to jump to that player or game · New sorts: 'biggest payout' on Top Picks, 'highest win odds' and 'biggest payout' on team winners"],["V3.2","Combos: tap + Combo on any Kalshi pick or team winner to build a combo slip with the model's combined chance and same-game warnings, then get a live market-maker price and buy it from the slip · The worker learns how Kalshi prices combo quotes from your own past combo fills and won't buy a combo until it can confirm that · Single orders switch to Kalshi's newer order endpoint automatically if the old one is retired"],["V3.1","⚡ One-click Kalshi orders: connect your own Cloudflare Worker on the My Bets tab, then every Kalshi pick, team winner and line gets a Buy button that opens an order ticket (live price, contracts, max price, cost and payout) and places the order only when you confirm · Worker caps order size and rejects the order if the price moved"],["V3.0","More data behind every projection: nflverse snap share, target and air-yards share, red-zone looks and expected TDs, Next Gen Stats, the official NFL injury report with practice status, ESPN depth charts and the official NBA injury report · Sportsbook consensus lines from The Odds API (optional key) · Bet buttons on every pick, team winner and line that open the exact Kalshi market with your side picked · Market Check bar on every pick: model vs Kalshi vs books · Far-from-market flag drops the tier a step · Kalshi picks graded by Kalshi's settlement with an ESPN cross-check; disagreements flagged, not counted · Data-sources strip, usage meters and a grading donut"],["V2.1","Auto-refresh while the page is open · A–D sureness grade on every game · My Bets: your Kalshi bets with model value and a cash-out signal · Team winners with a pick grade on the Projections tab · game-winner tracker on the Accuracy tab that grades every projected winner and suggests tweaks"],["V1.2","Tap any accuracy row, tile or day to see which picks hit or missed · projected winner, final score and combined total for every game · version and update times in the corner"],["V1.1","Redesign with team colors and player photos, picks grouped by game, Lock/Strong/Lean tiers, last-10 sparklines, matchup grades, streaks, line movement, player rest and workload, teammate and opponent injuries, usage trends, NBA pace, phone layout"],["V1.0","Kalshi + Pick6 picks for NFL and NBA, full stat projections, weather, rest and travel, defense vs position, self-grading accuracy tracker"]].map(([v, t]) => `<div class="fx" style="justify-content:flex-start;gap:14px"><b style="color:var(--brass);min-width:38px">${v}</b><span>${t}</span></div>`).join("")}
    <h3 style="margin-top:14px">Limits</h3>
    <p class="note">Free data doesn't say who guards whom, so "vs the defender" means what the defense allows to that position. nflverse stats update about once a day, so a game from last night may not be in the usage numbers yet. The Odds API free plan has 500 credits a month, so sportsbook lines refresh a few times a day for the soonest games. Injury news can break after the last refresh.</p></div></div>`;
}

// ---------------- shell ----------------
function render() {
  save();
  document.querySelectorAll("#sportSeg button").forEach(b => b.classList.toggle("on", b.dataset.s === S.sport));
  document.querySelectorAll("#tabs button, #bnav button").forEach(b => b.classList.toggle("on", b.dataset.t === S.tab));
  ["picks","players","games","bets","acc","how"].forEach(t => $("#v-"+t).classList.toggle("hide", S.tab !== t));
  if (!B) return;
  if (S.game !== "all" && !gameOf(S.game)) S.game = "all";
  if (S.tab === "bets") $("#kpis").innerHTML = ""; else kpis();
  ({picks:renderPicks, players:renderPlayers, games:renderGames, bets:renderBets, acc:renderAcc, how:renderHow})[S.tab]();
  drawSlipBar();
}
document.querySelectorAll("#sportSeg button").forEach(b => b.onclick = () => { S.sport = b.dataset.s; S.game = "all"; S.pstat = "all"; render(); });
document.querySelectorAll("#tabs button, #bnav button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); window.scrollTo({top:0}); });
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; if (S.tab !== "picks" && S.tab !== "players") S.tab = "picks"; render(); }, 150); });

(async function load() {
  render();
  try { B = await (await fetch("data/board.json?t=" + Date.now())).json(); }
  catch (e) { $("#v-picks").innerHTML = `<div class="empty">No data yet. The first update runs a few minutes after setup.</div>`; return; }
  if (!B.sports[S.sport]) S.sport = Object.keys(B.sports)[0] || "NBA";
  const stamp = t => new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  $("#updG").innerHTML = `Games &amp; lines <b>${stamp(B.updated)}</b>`;
  const ga = (B.summary || {}).gradedAt;
  const lastDay = ((B.summary || {}).recent || []).map(r => r[9]).sort().pop();
  $("#updR").innerHTML = ga ? `Grades <b>${stamp(ga)}</b>` : lastDay ? `Grades <b>through ${new Date(lastDay + "T12:00:00").toLocaleDateString([], {month:"short", day:"numeric"})} games</b>` : `Grades <b>waiting on first finals</b>`;
  if (B.version) $("#ver").textContent = "V" + B.version;
  render();
  try { P = await (await fetch("data/players.json?t=" + Date.now())).json(); } catch (e) { P = {}; }
  await loadBets(); if (S.tab === "bets" || S.tab === "acc") render();
  if (tradeOn()) { try { TR.status = await wcall("/status"); if (S.tab === "bets") render(); } catch (e) {} }
})();
// Auto-refresh: check for new data every 5 minutes, and whenever the tab comes back into view,
// so a tab left open never shows stale games, records or grades.
async function refreshBoard() {
  try {
    const nb = await (await fetch("data/board.json?t=" + Date.now(), {cache: "no-store"})).json();
    if (!nb || !nb.sports || !B || nb.updated === B.updated) return;
    B = nb;
    if (!B.sports[S.sport]) S.sport = Object.keys(B.sports)[0] || "NBA";
    const stamp = t => new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    $("#updG").innerHTML = `Games &amp; lines <b>${stamp(B.updated)}</b>`;
    const ga = (B.summary || {}).gradedAt;
    const lastDay = ((B.summary || {}).recent || []).map(r => r[9]).sort().pop();
    $("#updR").innerHTML = ga ? `Grades <b>${stamp(ga)}</b>` : lastDay ? `Grades <b>through ${new Date(lastDay + "T12:00:00").toLocaleDateString([], {month:"short", day:"numeric"})} games</b>` : `Grades <b>waiting on first finals</b>`;
    if (B.version) $("#ver").textContent = "V" + B.version;
    try { P = await (await fetch("data/players.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) {}
    if (T) { try { T = await (await fetch("data/track.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) {} }
    await loadBets();
    const y = window.scrollY; render(); window.scrollTo({top: y});
  } catch (e) {}
}
let lastCheck = Date.now();
const checkNow = () => { lastCheck = Date.now(); refreshBoard(); };
setInterval(() => { if (!document.hidden) checkNow(); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastCheck > 60 * 1000) checkNow(); });
</script>
